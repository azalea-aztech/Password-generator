<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="headings">
            <h1>Generate a</h1>
            <h1 id="second-heading">random password</h1>
        </div>
        <h3>Never use an insecure password again.</h3>
        <div id="lengthInput">
            <label for="passwordLength">Password length (8-128):</label>
            <input type="number" id="passwordLength" min="8" max="128" value="15">
        </div>
        <button id="generateBtn" onclick="generatePasswords()">Generate passwords</button>
        <hr>
        <div id="passwords">
            <p class="password" id="password1" onclick="copyToClipboard('password1')">password</p>
            <p class="password" id="password2" onclick="copyToClipboard('password2')">password</p>
        </div>
        <p id="copyAlert"></p>
        <script src="index.js"></script>
    </body>
</html>
