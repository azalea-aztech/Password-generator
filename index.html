<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="headings">
            <h1>Generate a</h1>
            <h1 id="second-heading">random password</h1>
        </div>
        <h3>Never use an insecure password again.</h3>
        <div id="lengthInput">
            <label for="passwordLength">Password length (8-128 characters):</label>
            <input type="number" id="passwordLength" min="8" max="128" value="15">
        </div>
        <div id="characterTypesDiv">
            <div>
                <input type="checkbox" id="typeNumbers">
                <label for="typeNumbers">Include numbers</label>
            </div>
            <div>
                <input type="checkbox" id="typeSymbols"> 
                <label for="typeSymbols">Include symbols</label>
            </div>
        </div>
        <p id="warning"></p>
        <button id="generateBtn" onclick="generatePasswords()">Generate passwords</button>
        <hr>
        <div id="passwords">
            <p class="password" id="password1" onclick="copyToClipboard('password1')"></p>
            <p class="password" id="password2" onclick="copyToClipboard('password2')"></p>
        </div>
        <p id="copyAlert"></p>
        <script src="index.js"></script>
    </body>
</html>
